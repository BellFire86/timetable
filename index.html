<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 시간표</title>
<style>
:root{--ink:#1d2939;--muted:#667085;--line:#e7eaf0;--paper:#fff;--bg:#f5f7fb;--brand:#6658d3;--brand2:#eeeaff;--shadow:0 12px 35px #1822300d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1440px;margin:auto;padding:34px 34px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 6px 14px #6658d344}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.07em;font-weight:700}.title{font-size:25px;font-weight:750;letter-spacing:-.04em}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 15px;border-radius:11px;font-weight:650;cursor:pointer;transition:.15s}.btn:hover{border-color:#b7b0ef;background:#faf9ff}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.primary:hover{background:#5648c4}.btn.icon{font-size:17px;padding:8px 12px}.hero{display:flex;justify-content:space-between;align-items:end;margin:0 0 18px}.hero h1{font-size:30px;letter-spacing:-.05em;margin:0 0 4px}.hero p{color:var(--muted);margin:0}.weeknav{display:flex;align-items:center;gap:10px}.weeknav strong{min-width:120px;text-align:center;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}.card{background:var(--paper);border:1px solid #edf0f4;border-radius:17px;box-shadow:var(--shadow)}.gridwrap{overflow:auto;border-radius:17px}.timetable{min-width:760px;display:grid;grid-template-columns:78px repeat(5,minmax(120px,1fr));}.th{height:65px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;color:#475467}.th:first-child{color:#98a2b3}.day small{display:block;color:#98a2b3;font-size:11px;font-weight:500;text-align:center}.timecell,.slot{height:92px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.timecell{display:flex;flex-direction:column;justify-content:center;align-items:center;color:#475467;font-weight:700;font-size:13px;background:#fcfcfe}.timecell small{color:#98a2b3;font-weight:500;font-size:10px}.slot{padding:7px;cursor:pointer;transition:background .14s}.slot:hover{background:#faf9ff}.lesson{height:100%;border-radius:10px;padding:9px 10px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:3px;border-left:3px solid var(--accent)}.lesson strong{font-size:13px;line-height:1.25}.lesson span{font-size:11px;color:#475467}.lesson .room{font-size:10px;color:#667085}.emptyhint{color:#c1c7d0;font-size:12px;text-align:center;padding-top:29px}.side{padding:19px}.side h2{font-size:16px;margin:0 0 14px}.sidehead{display:flex;align-items:center;justify-content:space-between}.subject-list{display:flex;flex-direction:column;gap:9px}.subject{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #eff1f5;border-radius:11px}.swatch{height:12px;width:12px;border-radius:4px;flex:none}.subject b{font-size:13px;flex:1}.subject small{font-size:11px;color:var(--muted)}.emptylist{font-size:13px;color:var(--muted);padding:18px 4px}.sidefoot{border-top:1px solid var(--line);margin-top:17px;padding-top:15px;color:var(--muted);font-size:12px}.sidefoot div{margin:6px 0}.sidefoot b{color:#475467}.overlay{position:fixed;inset:0;background:#17203366;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.show{display:flex}.modal{width:min(440px,100%);background:white;border-radius:18px;padding:23px;box-shadow:0 25px 80px #10182833}.modal h2{margin:0 0 18px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#475467}.field input,.field select{height:42px;border:1px solid #dfe3eb;border-radius:9px;padding:0 11px;font:inherit;color:var(--ink);background:white}.field input[type=color]{padding:4px}.modal-actions{display:flex;justify-content:space-between;margin-top:21px}.right-actions{display:flex;gap:8px}.muted{color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 15px;background:#202939;color:white;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{order:2}.app{padding:22px 16px}.top{align-items:flex-start;gap:12px;flex-direction:column}.hero{align-items:flex-start;gap:15px;flex-direction:column}.actions{flex-wrap:wrap}}@media print{body{background:white}.app{max-width:none;padding:0}.actions,.weeknav,.side,.emptyhint{display:none!important}.layout{display:block}.card{box-shadow:none;border:0}.timetable{min-width:0}.slot,.timecell{height:78px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">▦</div><div><div class="eyebrow">MY WEEK, IN ORDER</div><div class="title">오늘의 시간표</div></div></div><div class="actions"><button class="btn" id="settingsBtn">⚙ 시간 설정</button><button class="btn" id="exportBtn">내보내기</button><button class="btn" id="importBtn">가져오기</button><button class="btn primary" id="printBtn">⤓ 인쇄하기</button><input type="file" id="fileInput" accept="application/json" hidden></div></header>
<section class="hero"><div><h1>이번 주 수업</h1><p>수업을 눌러 과목과 선생님을 기록해보세요.</p></div><div class="weeknav"><button class="btn icon" id="prevWeek">‹</button><strong id="weekLabel"></strong><button class="btn icon" id="nextWeek">›</button><button class="btn" id="todayBtn">이번 주</button></div></section>
<div class="layout"><section class="card gridwrap"><div class="timetable" id="table"></div></section><aside class="card side"><div class="sidehead"><h2>과목 목록</h2><button class="btn icon" id="addSubject" title="과목 추가">＋</button></div><div class="subject-list" id="subjects"></div><div class="sidefoot"><div>수업 시간 <b id="periodCount"></b></div><div>저장 방식 <b>이 기기에 자동 저장</b></div><p>칸을 클릭하면 수업을 추가하거나 수정할 수 있어요.</p></div></aside></div></main>
<div class="overlay" id="lessonModal"><div class="modal"><h2 id="lessonTitle">수업 추가</h2><div class="form"><div class="field full"><label>과목</label><select id="subjectSelect"></select></div><div class="field"><label>선생님</label><input id="teacherInput" placeholder="예: 김선생님"></div><div class="field"><label>교실 / 장소</label><input id="roomInput" placeholder="예: 2-3 교실"></div><div class="field full"><label>메모 (선택)</label><input id="noteInput" placeholder="준비물, 과제 등"></div></div><div class="modal-actions"><button class="btn" id="deleteLesson" style="color:#c0394b">삭제</button><div class="right-actions"><button class="btn" data-close="lessonModal">취소</button><button class="btn primary" id="saveLesson">저장</button></div></div></div></div>
<div class="overlay" id="subjectModal"><div class="modal"><h2 id="subjectTitle">과목 추가</h2><div class="form"><div class="field full"><label>과목 이름</label><input id="subjectName" placeholder="예: 수학"></div><div class="field"><label>대표 색상</label><input id="subjectColor" type="color" value="#dcd7ff"></div><div class="field"><label>선생님 (선택)</label><input id="subjectTeacher" placeholder="예: 김선생님"></div></div><div class="modal-actions"><span></span><div class="right-actions"><button class="btn" data-close="subjectModal">취소</button><button class="btn primary" id="saveSubject">추가</button></div></div></div></div>
<div class="overlay" id="settingsModal"><div class="modal"><h2>시간표 설정</h2><div class="form"><div class="field full"><label>하루 교시 수 (1~10)</label><input id="periodInput" type="number" min="1" max="10"></div><div class="field full"><label>교시별 시작·종료 시간</label><div id="periodTimes" style="display:grid;gap:8px"></div></div></div><div class="modal-actions"><span class="muted" style="font-size:12px">시간 변경 시 기존 수업은 교시 기준으로 유지됩니다.</span><div class="right-actions"><button class="btn" data-close="settingsModal">취소</button><button class="btn primary" id="saveSettings">적용</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DAYS=['월','화','수','목','금'];const defaultState={periods:[['09:00','09:45'],['09:55','10:40'],['10:50','11:35'],['11:45','12:30'],['13:20','14:05'],['14:15','15:00']],subjects:[{id:'math',name:'수학',color:'#dcd7ff',teacher:'김선생님'},{id:'korean',name:'국어',color:'#ffe3d4',teacher:'박선생님'},{id:'english',name:'영어',color:'#d5efff',teacher:'이선생님'},{id:'science',name:'과학',color:'#d8f3df',teacher:'최선생님'},{id:'pe',name:'체육',color:'#ffe7a8',teacher:'정선생님'}],lessons:{}};
let state=load(),weekOffset=0,editingSlot=null,editingSubjectId=null;function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem('class-planner-v1')||'{}')}}catch{return structuredClone(defaultState)}}function persist(){localStorage.setItem('class-planner-v1',JSON.stringify(state));render()}function key(d,p){return `${d}-${p}`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const t=document.getElementById('table');t.innerHTML='<div class="th">교시</div>'+DAYS.map((d,i)=>`<div class="th day">${d}요일<small>${i===0?'MON':['MON','TUE','WED','THU','FRI'][i]}</small></div>`).join('');state.periods.forEach((tm,p)=>{t.insertAdjacentHTML('beforeend',`<div class="timecell">${p+1}교시<small>${esc(tm[0])}–${esc(tm[1])}</small></div>`);DAYS.forEach((d,di)=>{const l=state.lessons[key(di,p)],s=l&&state.subjects.find(x=>x.id===l.subjectId);t.insertAdjacentHTML('beforeend',`<div class="slot" data-day="${di}" data-period="${p}">${l&&s?`<div class="lesson" style="--accent:${s.color};background:${s.color}66"><strong>${esc(s.name)}</strong><span>${esc(l.teacher||s.teacher||'선생님 미지정')}</span>${l.room?`<span class="room">⌖ ${esc(l.room)}</span>`:''}</div>`:'<div class="emptyhint">＋ 수업 추가</div>'}</div>`)})});document.getElementById('subjects').innerHTML=state.subjects.length?state.subjects.map(s=>`<div class="subject"><span class="swatch" style="background:${s.color}"></span><b>${esc(s.name)}</b><small>${esc(s.teacher||'')}</small><button class="btn icon edit-subject" data-id="${s.id}" title="과목 편집" style="border:0;padding:3px 6px">⋯</button></div>`).join(''):'<div class="emptylist">＋ 버튼으로 과목을 추가하세요.</div>';document.getElementById('periodCount').textContent=`${state.periods.length}교시`;document.getElementById('weekLabel').textContent=getWeekLabel();t.querySelectorAll('.slot').forEach(el=>el.onclick=()=>openLesson(+el.dataset.day,+el.dataset.period));document.querySelectorAll('.edit-subject').forEach(el=>el.onclick=()=>editSubject(el.dataset.id))}
function getWeekLabel(){const now=new Date(),day=(now.getDay()+6)%7;now.setDate(now.getDate()-day+weekOffset*7);const start=new Date(now);const end=new Date(now);end.setDate(end.getDate()+4);const f=d=>`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;return `${f(start)} – ${f(end)}`}
function show(id){document.getElementById(id).classList.add('show')}function close(id){document.getElementById(id).classList.remove('show')}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function openLesson(d,p){editingSlot={d,p};const l=state.lessons[key(d,p)];document.getElementById('lessonTitle').textContent=`${DAYS[d]}요일 ${p+1}교시`;document.getElementById('subjectSelect').innerHTML=state.subjects.length?state.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''):'<option value="">과목 없음 — 과목을 먼저 추가하세요</option>';if(l){document.getElementById('subjectSelect').value=l.subjectId;document.getElementById('teacherInput').value=l.teacher||'';document.getElementById('roomInput').value=l.room||'';document.getElementById('noteInput').value=l.note||''}else{document.getElementById('subjectSelect').selectedIndex=0;const s=state.subjects[0];document.getElementById('teacherInput').value=s?.teacher||'';document.getElementById('roomInput').value='';document.getElementById('noteInput').value=''}document.getElementById('deleteLesson').style.visibility=l?'visible':'hidden';show('lessonModal')}
document.getElementById('saveLesson').onclick=()=>{if(!state.subjects.length){toast('먼저 과목을 추가해 주세요.');close('lessonModal');openSubject();return}const {d,p}=editingSlot;state.lessons[key(d,p)]={subjectId:document.getElementById('subjectSelect').value,teacher:document.getElementById('teacherInput').value.trim(),room:document.getElementById('roomInput').value.trim(),note:document.getElementById('noteInput').value.trim()};close('lessonModal');persist();toast('시간표를 저장했어요.')};document.getElementById('deleteLesson').onclick=()=>{delete state.lessons[key(editingSlot.d,editingSlot.p)];close('lessonModal');persist();toast('수업을 삭제했어요.')};
function openSubject(s=null){editingSubjectId=s?.id||null;document.getElementById('subjectTitle').textContent=s?'과목 편집':'과목 추가';document.getElementById('saveSubject').textContent=s?'수정':'추가';document.getElementById('subjectName').value=s?.name||'';document.getElementById('subjectColor').value=s?.color||'#dcd7ff';document.getElementById('subjectTeacher').value=s?.teacher||'';show('subjectModal')}function editSubject(id){const s=state.subjects.find(x=>x.id===id);if(s)openSubject(s)}document.getElementById('addSubject').onclick=()=>openSubject();document.getElementById('saveSubject').onclick=()=>{const name=document.getElementById('subjectName').value.trim();if(!name){toast('과목 이름을 입력해 주세요.');return}const color=document.getElementById('subjectColor').value,teacher=document.getElementById('subjectTeacher').value.trim();if(editingSubjectId){const s=state.subjects.find(x=>x.id===editingSubjectId);Object.assign(s,{name,color,teacher})}else state.subjects.push({id:crypto.randomUUID(),name,color,teacher});close('subjectModal');persist();toast('과목을 저장했어요.')};
document.getElementById('settingsBtn').onclick=()=>{document.getElementById('periodInput').value=state.periods.length;drawTimes();show('settingsModal')};function drawTimes(){const count=Math.max(1,Math.min(10,+document.getElementById('periodInput').value||1)),wrap=document.getElementById('periodTimes');wrap.innerHTML='';for(let i=0;i<count;i++){const tm=state.periods[i]||['09:00','09:45'];wrap.insertAdjacentHTML('beforeend',`<div style="display:flex;align-items:center;gap:8px"><b style="width:48px;font-size:12px">${i+1}교시</b><input aria-label="시작 시간" type="time" value="${tm[0]}" data-i="${i}" data-part="0" style="flex:1;height:38px;border:1px solid #dfe3eb;border-radius:8px;padding:0 8px"><span>–</span><input aria-label="종료 시간" type="time" value="${tm[1]}" data-i="${i}" data-part="1" style="flex:1;height:38px;border:1px solid #dfe3eb;border-radius:8px;padding:0 8px"></div>`)}}document.getElementById('periodInput').oninput=drawTimes;document.getElementById('saveSettings').onclick=()=>{const inputs=[...document.querySelectorAll('#periodTimes input')],n=Math.max(1,Math.min(10,+document.getElementById('periodInput').value||1)),arr=Array.from({length:n},()=>['09:00','09:45']);inputs.forEach(el=>arr[+el.dataset.i][+el.dataset.part]=el.value);state.periods=arr;close('settingsModal');persist();toast('시간표 설정을 적용했어요.')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)close(o.id)}));document.getElementById('prevWeek').onclick=()=>{weekOffset--;render()};document.getElementById('nextWeek').onclick=()=>{weekOffset++;render()};document.getElementById('todayBtn').onclick=()=>{weekOffset=0;render()};document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='내-시간표.json';a.click();URL.revokeObjectURL(a.href);toast('시간표 파일을 내보냈어요.')};document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.periods)||!Array.isArray(data.subjects)||typeof data.lessons!=='object')throw 0;state=data;persist();toast('시간표를 가져왔어요.')}catch{toast('올바른 시간표 파일을 선택해 주세요.')}e.target.value=''};render();
</script></body></html>
